<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quantum Courier // Arcade</title><style>body{margin:0;background:#080811;color:#e2e8f0;font:16px system-ui;text-align:center}main{max-width:760px;margin:auto;padding:30px}canvas{width:100%;background:#0b0b16;border:1px solid #00f3ff;border-radius:12px}button{padding:12px 20px;background:#00f3ff;border:0;border-radius:6px;font-weight:bold;cursor:pointer}.hud{display:flex;justify-content:space-between;gap:10px;color:#00f3ff;margin:12px 0}.back{color:#ff78ad;text-decoration:none;display:inline-block;margin-bottom:20px}</style></head><body><main><a class="back" href="index.html">← Return to Loom</a><h1>QUANTUM COURIER</h1><p>Move both linked couriers through dual realities. Collect every package before the timeline collapses.</p><div class="hud"><span id="a">ALPHA 0/3</span><span id="t">30.0s</span><span id="b">BETA 0/3</span></div><canvas id="q" width="600" height="600"></canvas><p><button id="start">INITIALIZE</button> Use WASD / arrows. Space restarts.</p></main><script>const c=q,x=c.getContext('2d'),K={},obs=[{x:140,y:40,w:20,h:160},{x:280,y:120,w:120,h:20},{x:460,y:140,w:20,h:120}],A=[{x:200,y:80},{x:360,y:220},{x:520,y:70}],B=[{x:80,y:520},{x:200,y:380},{x:500,y:520}];let p={x:50,y:150},z={x:550,y:450},on=0,tm=30,raf;onkeydown=e=>{K[e.key.toLowerCase()]=1;if(e.code==='Space')reset()};onkeyup=e=>K[e.key.toLowerCase()]=0;start.onclick=reset;function reset(){p={x:50,y:150};z={x:550,y:450};A.forEach(v=>v.hit=0);B.forEach(v=>v.hit=0);tm=30;on=1;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function move(o,dx,dy,top){o.x=Math.max(15,Math.min(585,o.x+dx));o.y=Math.max(top?15:315,Math.min(top?285:585,o.y+dy))}function loop(t){x.fillStyle='#0b0b16';x.fillRect(0,0,600,600);x.strokeStyle='#ffffff22';for(let i=0;i<600;i+=30){x.beginPath();x.moveTo(i,0);x.lineTo(i,600);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(600,i);x.stroke()}x.strokeStyle='#ffffff55';x.setLineDash([8,8]);x.beginPath();x.moveTo(0,300);x.lineTo(600,300);x.stroke();x.setLineDash([]);let dx=(K.a?-3.5:0)+(K.d?3.5:0),dy=(K.w?-3.5:0)+(K.s?3.5:0);if(on){move(p,dx,dy,1);move(z,-dx,-dy,0);tm-=.016}x.fillStyle='#182840';obs.forEach(o=>x.fillRect(o.x,o.y,o.w,o.h));x.fillStyle='#00f3ff';A.forEach(v=>{if(!v.hit&&Math.hypot(p.x-v.x,p.y-v.y)<24)v.hit=1;if(!v.hit){x.beginPath();x.arc(v.x,v.y,7,0,7);x.fill()}});x.fillStyle='#ff0055';B.forEach(v=>{if(!v.hit&&Math.hypot(z.x-v.x,z.y-v.y)<24)v.hit=1;if(!v.hit){x.beginPath();x.arc(v.x,v.y,7,0,7);x.fill()}});x.fillStyle='#fff';x.beginPath();x.arc(p.x,p.y,14,0,7);x.fill();x.beginPath();x.arc(z.x,z.y,14,0,7);x.fill();let aa=A.filter(v=>v.hit).length,bb=B.filter(v=>v.hit).length;a.textContent=`ALPHA ${aa}/3`;b.textContent=`BETA ${bb}/3`;t.textContent=`${Math.max(0,tm).toFixed(1)}s`;if(aa===3&&bb===3){on=0;x.fillStyle='#ffe600';x.font='bold 24px sans-serif';x.textAlign='center';x.fillText('TIMELINE SYNCHRONIZED',300,300)}else if(tm<=0){on=0;x.fillStyle='#ff0055';x.font='bold 24px sans-serif';x.textAlign='center';x.fillText('PARADOX COLLAPSE',300,300)}if(on)raf=requestAnimationFrame(loop)}reset()</script></body></html>
