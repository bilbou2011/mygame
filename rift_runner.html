<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rift Runner // Moonforge Arcade</title><style>body{margin:0;background:radial-gradient(circle at 50% 0,#34205c,#070812 55%);color:#f4f3ff;font:16px system-ui;text-align:center}main{width:min(900px,92%);margin:auto;padding:28px}.back{color:#86f7df;text-decoration:none}.hud{display:flex;justify-content:space-around;color:#ffd479;margin:18px 0}canvas{width:100%;border:1px solid #ffffff22;border-radius:18px;background:#070913}button{border:0;border-radius:9px;padding:12px 22px;background:#86f7df;font-weight:800;cursor:pointer}</style></head><body><main><a class="back" href="index.html">← Return to the Loom</a><h1>RIFT RUNNER</h1><p>Run through a collapsing reality. Collect shards. Don't touch the rifts.</p><div class="hud"><span>SHARDS <b id="score">0</b></span><span>BEST <b id="best">0</b></span><span>WAVE <b id="wave">1</b></span></div><canvas id="c" width="900" height="520"></canvas><p><button id="go">START RUN</button> · WASD / arrows</p></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),K={};let p,shards,rocks,on,score=0,best=+localStorage.riftBest||0,wave=1,last=0;addEventListener('keydown',e=>K[e.key.toLowerCase()]=1);addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);go.onclick=()=>{p={x:450,y:260};shards=[];rocks=[];score=0;wave=1;on=1;for(let i=0;i<5;i++)spawn();requestAnimationFrame(loop)};function spawn(){rocks.push({x:Math.random()*860+20,y:Math.random()*480+20,r:14+Math.random()*18,vx:-40-Math.random()*50,vy:-40+Math.random()*80});shards.push({x:Math.random()*840+30,y:Math.random()*460+30})}function loop(t){let dt=Math.min((t-last)/1000,.04);last=t;x.fillStyle='#070913';x.fillRect(0,0,900,520);x.strokeStyle='#ffffff0d';for(let i=0;i<900;i+=45){x.beginPath();x.moveTo(i,0);x.lineTo(i,520);x.stroke()}let dx=(K.a||K.arrowleft?-1:0)+(K.d||K.arrowright?1:0),dy=(K.w||K.arrowup?-1:0)+(K.s||K.arrowdown?1:0);let m=Math.hypot(dx,dy)||1;p.x=Math.max(14,Math.min(886,p.x+dx/m*260*dt));p.y=Math.max(14,Math.min(506,p.y+dy/m*260*dt));rocks.forEach(r=>{r.x+=r.vx*dt;r.y+=r.vy*dt;if(r.x<r.r||r.x>900-r.r)r.vx*=-1;if(r.y<r.r||r.y>520-r.r)r.vy*=-1;x.strokeStyle='#ff6879';x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.stroke();if(Math.hypot(p.x-r.x,p.y-r.y)<r.r+13)on=0});for(let i=shards.length-1;i>=0;i--){let s=shards[i];x.fillStyle='#ffd479';x.beginPath();x.arc(s.x,s.y,7,0,7);x.fill();if(Math.hypot(p.x-s.x,p.y-s.y)<20){shards.splice(i,1);score++;document.getElementById('score').textContent=score;best=Math.max(best,score);localStorage.riftBest=best;document.getElementById('best').textContent=best;if(!shards.length){wave++;document.getElementById('wave').textContent=wave;for(let j=0;j<wave+4;j++)spawn()}}}x.fillStyle='#86f7df';x.beginPath();x.arc(p.x,p.y,13,0,7);x.fill();if(!on){x.fillStyle='#fff';x.font='bold 28px system-ui';x.textAlign='center';x.fillText('RIFT COLLAPSE — PRESS START',450,260);return}requestAnimationFrame(loop)}go.click()</script></body></html>
