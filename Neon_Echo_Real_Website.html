<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Echo // Arcade</title><style>body{margin:0;background:radial-gradient(circle at 50% -10%,#202752,#080a12 45%);color:#f5f7ff;font:16px system-ui;text-align:center}main{width:min(900px,92%);margin:auto;padding:25px}.back{color:#54e8ff;text-decoration:none}canvas{display:block;width:100%;margin-top:20px;border:1px solid #283049;border-radius:16px;cursor:crosshair}button{padding:12px 22px;border:0;border-radius:10px;background:#7c8cff;color:#fff;font-weight:bold;cursor:pointer}.stats{color:#aab3c9;display:flex;justify-content:space-around;margin-top:20px}</style></head><body><main><a class="back" href="index.html">← Return to Loom</a><h1>NEON ECHO</h1><p>Click the glowing core before the echo disappears. Every level gets faster.</p><div class="stats"><span>SCORE <b id="s">0</b></span><span>BEST <b id="b">0</b></span><span>LEVEL <b id="l">1</b></span><span>LIVES <b id="v">3</b></span></div><canvas id="n" width="1000" height="570"></canvas><p><button id="go">START GAME</button></p></main><script>const c=n,x=c.getContext('2d'),S=s,B=b,L=l,V=v;let run=0,score=0,best=+localStorage.echoBest||0,level=1,lives=3,core,parts=[],last=0;function spawn(){core={x:70+Math.random()*860,y:60+Math.random()*450,r:Math.max(11,28-level),born:performance.now(),life:Math.max(600,1700-level*70)}}function start(){score=0;level=1;lives=3;run=1;spawn();loop(performance.now())}go.onclick=start;c.onpointerdown=e=>{if(!run)return;let r=c.getBoundingClientRect(),x0=(e.clientX-r.left)*1000/r.width,y0=(e.clientY-r.top)*570/r.height;if(Math.hypot(x0-core.x,y0-core.y)<core.r+20){score+=10+level*2;level=1+Math.floor(score/80);best=Math.max(best,score);spawn()}else{lives--;if(lives<1)run=0;else spawn()}S.textContent=score;B.textContent=best;L.textContent=level;V.textContent=lives;localStorage.echoBest=best};function loop(t){x.fillStyle='#060811';x.fillRect(0,0,1000,570);x.strokeStyle='#111727';for(let i=0;i<1000;i+=50){x.beginPath();x.moveTo(i,0);x.lineTo(i,570);x.stroke()}for(let j=0;j<570;j+=50){x.beginPath();x.moveTo(0,j);x.lineTo(1000,j);x.stroke()}if(core){let p=1-(t-core.born)/core.life;x.shadowBlur=25;x.shadowColor='#54e8ff';x.fillStyle='#54e8ff';x.beginPath();x.arc(core.x,core.y,core.r*(1+Math.sin(t/100)*.12),0,7);x.fill();x.shadowBlur=0;if(p<=0){lives--;V.textContent=lives;if(lives<1)run=0;else spawn()}}if(!run){x.fillStyle='#fff';x.font='bold 28px system-ui';x.textAlign='center';x.fillText('PRESS START TO ENTER THE ECHO',500,300);return}raf=requestAnimationFrame(loop)}let raf;loop(0)</script></body></html>
