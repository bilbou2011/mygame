<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Constellation Loom</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="hud-panel">
        <div class="brand-wrap">
          <span class="pill">Dreamcraft</span>
          <h1>Constellation Loom</h1>
        </div>
        <div class="stats">
          <div class="stat"><span class="label">Seeds</span><strong id="seedCount">0</strong></div>
          <div class="stat"><span class="label">Time</span><strong id="timer">45</strong></div>
          <div class="stat"><span class="label">Pulse</span><strong id="pulseDisplay">Ready</strong></div>
        </div>
      </div>
      <canvas id="gameCanvas" width="960" height="600" aria-label="Constellation Loom game canvas"></canvas>
      <div class="message" id="messageBox">
        <h2 id="messageTitle">The Loom is waiting</h2>
        <p id="messageText">Gather 12 starlight seeds and survive the nightweed swarm.</p>
        <button id="startButton">Begin</button>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
